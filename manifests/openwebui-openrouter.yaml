apiVersion: v1
kind: Namespace
metadata:
  name: clusty
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: clusty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_BASE_URL
              value: https://openrouter.ai/api/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openrouter-api
                  key: OPENROUTER_API_KEY
            - name: DEFAULT_MODELS
              value: openai/gpt-4o-mini
            - name: ENABLE_SIGNUP
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: app-data
              mountPath: /app/backend/data
      volumes:
        - name: app-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: clusty
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
